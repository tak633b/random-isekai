# main に push されたら、テストしてから vite build して Cloudflare Pages (関数と D1 の追悼館つき) に出す。手順は docs/DEPLOY.md
# 秘密 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が無いあいだは、テストとビルドだけをして出さない
name: cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # 広告の ID は GitHub の Variables から (秘密ではない。ページの HTML に出る)。無ければ広告なしでビルドされる
      - run: npm run build
        env:
          VITE_ADSENSE_CLIENT: ${{ vars.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT_TITLE: ${{ vars.VITE_ADSENSE_SLOT_TITLE }}
          VITE_ADSENSE_SLOT_DEATH: ${{ vars.VITE_ADSENSE_SLOT_DEATH }}
          VITE_ADSENSE_SLOT_PAST: ${{ vars.VITE_ADSENSE_SLOT_PAST }}
          VITE_ADSENSE_SLOT_COLLECTION: ${{ vars.VITE_ADSENSE_SLOT_COLLECTION }}
          # Google でログイン (記録の引き継ぎ) のクライアント ID。秘密ではない。無ければログインなしでビルドされる
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - name: D1 のマイグレーション (まだのものだけ)
        if: env.HAS_CF == 'true'
        run: npx wrangler d1 migrations apply random-isekai-memorial --remote
      - name: Cloudflare Pages に出す
        if: env.HAS_CF == 'true'
        run: npx wrangler pages deploy --project-name random-isekai --branch main --commit-hash "${{ github.sha }}"
