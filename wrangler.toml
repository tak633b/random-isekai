# Cloudflare Pages の設定 (静的な dist/ + functions/ の API + D1 の追悼館)。手順は docs/DEPLOY.md
name = "random-isekai"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "random-isekai-memorial"
# 作成済みの D1 (2026-10-09)。手元の pages dev は --local でこの id のまま動く
database_id = "6f283ca7-0410-4098-927c-302534b91b4c"
migrations_dir = "migrations"

# 秘密 (コードに書かない): ADMIN_TOKEN は `npx wrangler pages secret put ADMIN_TOKEN --project-name random-isekai`
[vars]
REPORT_HIDE = "3"
